# ------------------------------------------------------------------------------
# Tuning de la moto. Se lee al arrancar y se recarga en caliente con F5.
# Formato: clave = valor   (# o ; comentan). Lo que falte usa el valor del código.
# Espacio local de la moto: origen = centro de masa, +Z adelante, +Y arriba.
# ------------------------------------------------------------------------------

# --- Masa (moto 105 kg + piloto 75 kg en un único rigid body) ------------------
mass           = 180
inertia_pitch  = 65      # kg m^2 (cabeceo: wheelies, saltos; incluye piloto de pie)
inertia_yaw    = 50
inertia_roll   = 26

# --- Centro de masa efectivo (también con [ ] - = 0 en el juego) --------------
com_height     = 0.0     # m, + más alto => más transferencia de peso
com_forward    = 0.0     # m, + adelante => menos wheelie, más stoppie
rider_shift    = 0.25    # m que mueve el piloto el COM con el stick a fondo
rider_speed    = 6.0
rider_pitch_damping = 150  # brazos/piernas del piloto absorben el cabeceo (con ruedas en el suelo)
rider_side_shift    = 0.10   # m que corre el centro de masa el cuerpo de costado (flechas izquierda / derecha)
rider_side_steer    = 0.35   # cuánto dobla el cuerpo solo, sin manubrio (fracción de la curva máxima)

# --- Geometría: eje con la suspensión totalmente comprimida -------------------
front_mount_y  = -0.30
front_mount_z  = 0.74
rake_deg       = 27
rear_mount_y   = -0.29
rear_mount_z   = -0.62
rear_axis_deg  = 8

# --- Suspensión ----------------------------------------------------------------
# Resorte casi lineal (guarda poca energía al fondo: no "patea" al aterrizar) y los aterrizajes los
# frena el hidráulico: amortiguación de compresión + cono de fin de recorrido.
front_travel               = 0.30
front_spring               = 6800    # N/m (sag ~29% con el piloto)
front_damping              = 1000    # N/(m/s) al comprimir
front_rebound_ratio        = 3.0     # la extensión se amortigua 3x más (sin rebote, pero recupera entre baches)
front_bottoming_damping    = 5.0     # amortiguación extra en el último 20% del recorrido (x veces)
front_progressivity        = 1.2     # force *= 1 + x^2 * progressivity
front_bump_stop            = 150000
front_bump_damping         = 6000
front_max_damper_velocity  = 12.0    # tope de velocidad del amortiguador (más alto: absorbe mejor las caídas grandes)

rear_travel                = 0.32
rear_spring                = 7300    # sag ~36%
rear_damping               = 1100
rear_rebound_ratio         = 3.0
rear_bottoming_damping     = 5.0
rear_progressivity         = 1.2
rear_bump_stop             = 150000
rear_bump_damping          = 6000
rear_max_damper_velocity   = 12.0

# --- Neumáticos -------------------------------------------------------------------
front_tire_radius     = 0.35
front_tire_inertia    = 0.60
front_tire_long_grip  = 1.00
front_tire_lat_grip   = 1.15
front_tire_roundness  = 0.06
front_tire_stiffness  = 400000   # N/m, el neumático también es un resorte
front_tire_damping    = 3500     # amortiguación de la goma al comprimirse
front_tire_rebound_damping = 20000 # al descomprimirse (histéresis): evita el rebote sobre las cubiertas al hacer tope
front_tire_unsprung_mass= 11       # kg de rueda (masa no suspendida)

rear_tire_radius      = 0.33
rear_tire_inertia     = 0.90
rear_tire_long_grip   = 1.00
rear_tire_lat_grip    = 1.10
rear_tire_roundness   = 0.06
rear_tire_stiffness   = 400000   # N/m, el neumático también es un resorte
rear_tire_damping     = 3500
rear_tire_rebound_damping  = 20000
rear_tire_unsprung_mass= 14       # kg de rueda (masa no suspendida)

long_stiffness      = 0.9    # 0..1, fracción del patinaje que se corrige por paso
lat_stiffness       = 0.8    # tope lateral (fracción de la fuerza que anula la deriva)
cornering_stiffness = 14     # N por N de carga por radián de deriva
min_slip_speed      = 3.0
tire_roll_coupling  = 0.5    # 1 = torque de rolido real de las fuerzas del neumático

# --- Frenos y resistencias ----------------------------------------------------------
front_brake_torque  = 950
rear_brake_torque   = 520
abs_slip            = 0.25   # 0 = sin ABS ni anti-endo delantero
brake_stand_up      = 0.6    # frenar adelante inclinado endereza la moto (se abre de la curva)
stoppie_yaw_damping = 1200    # mantiene recta la moto apoyada sólo en la delantera
rolling_resistance  = 0.03
drag_area           = 0.55

# --- Dirección y balance ---------------------------------------------------------------
max_steer_deg             = 42    # tope de dirección (KX450 real: 42 grados a cada lado)
max_steer_high_speed_deg  = 10
steer_rate                = 4.0
caster_align              = 2.0   # contravolante automático al cruzarse la trasera
caster_deadzone_deg       = 3     # deriva trasera normal que no dispara el contravolante
# Derrape con el freno trasero solo (Espacio / A), como se "cuadra" una horquilla en motocross.
slide_friction            = 0.72  # roce cinético de la cubierta que patina o está trabada (fracción del pico)
slide_hold_bars           = 0.85  # cuánto menos contravolante automático mientras se busca el derrape
slide_speed_max           = 13    # m/s: más rápido, frenar atrás es una frenada normal
slide_upright             = 0.55  # la moto va más derecha mientras la trasera derrapa
slide_angle_min           = 20    # grados de cola afuera con la dirección apenas tocada...
slide_angle_max           = 65    # ...y con la dirección a fondo (ahí el piloto afloja el freno)
slide_steer_in            = 6     # grados que el piloto apunta la delantera hacia la curva
slide_pivot               = 800   # Nm por rad: despacio (<13 km/h), freno trasero doblando, el piloto empuja la cola afuera
slide_wander              = 0.12  # roce de costado irregular de la cubierta que patina: la rueda clavada baila
min_turn_radius           = 1.8   # m a paso de hombre (distancia entre ejes 1.49 m / tan 39.5 grados en el piso)
max_lateral_accel         = 9.5   # m/s^2 en plano (en peraltes se puede más, ver bank_turn_gain)
bank_turn_gain            = 1.0   # cuánto dejan doblar más fuerte los peraltes (0 = como en plano)
max_lean_deg              = 55
lean_steer_speed_low      = 4     # m/s: debajo se dobla con manubrio
lean_steer_speed_high     = 12    # m/s: encima se dobla inclinando
leg_out_speed_min         = 1.0   # pata afuera: entre estas velocidades (m/s), doblando cerrado
leg_out_speed_max         = 14
leg_out_grip              = 0.1   # grip lateral extra con la pata afuera (carga la estribera de afuera)
leg_out_com_forward       = 0.06  # m que se adelanta el peso al sentarse en la punta del asiento
balance_k_low             = 4000
balance_k_high            = 2200
balance_d_low             = 900
balance_d_high            = 750
balance_max_torque        = 2600
balance_speed             = 14

# --- Aire ----------------------------------------------------------------------------------
air_pitch_torque        = 450    # Nm máximos para seguir la rotación pedida con el stick
air_pitch_rate          = 2.5    # rad/s de rotación con el stick a fondo
air_pitch_gain          = 500    # qué tan rápido responde (Nm por rad/s de diferencia)
air_neutral_damping     = 10     # con el stick suelto casi conserva el impulso
air_max_pitch_rate      = 3.5    # tope absoluto de rotación (acelerar/frenar la rueda en el aire)
air_pitch_rate_damping  = 150
air_roll_assist         = 0.15
air_reaction_gain       = 1.5    # exagera el efecto de acelerar/frenar la rueda en el aire
air_yaw_align           = 350    # alinea la moto con la dirección de vuelo (aterrizajes derechos)
air_yaw_damping         = 180
# Whip / scrub: con el stick al costado en el aire el piloto corre el cuerpo y la moto se acuesta
# para el otro lado (fuerza interna: se conserva el momento angular); al soltar, vuelve.
air_body_tilt_deg       = 35     # cuánto se corre el cuerpo respecto de la moto
air_body_inertia        = 22     # kg m^2 del cuerpo en rolido (cuánto empuja a la moto)
air_body_rate           = 8      # rad/s, qué tan rápido mueve el cuerpo
air_whip_assist_fade    = 1.0    # con el stick al costado no endereza la moto (0 = siempre endereza)
air_gyro_gain           = 0.5    # efecto giroscópico de las ruedas: acostada, la nariz dobla (1 = físico)
air_max_roll_rate       = 1.8    # rad/s de rolido; más rápido el piloto frena el giro
air_roll_rate_damping   = 150
wheelie_start_deg       = 12     # limitador de wheelie con el piloto neutro (ambos en 0 lo quitan)
wheelie_end_deg         = 27
wheelie_lean_back_deg   = 18     # grados extra permitidos con el piloto tirado atrás
wheelie_gear_fade       = 0.35   # el wheelie permitido se achica en cada marcha (1 = igual en todas)
wheelie_lean_torque     = 400    # Nm: tirarse adelante en un wheelie baja la rueda
wheelie_assist_torque   = 500    # Nm para bajar la nariz si el wheelie se pasa
wheelie_turn            = 900    # Nm por rad/s: doblando en wheelie la moto gira a la par de su trayectoria (0 = nada la orienta)
wheelie_align           = 4      # 1/s: y vuelve a apuntar hacia donde va (la trasera no queda cruzada)
tc_slip                 = 0.35   # slip trasero que tolera el control de tracción (F6)
crash_angle_deg         = 72     # inclinación que es caída tocando el suelo (en el aire se gira libre)

# --- Motor y caja ------------------------------------------------------------------------
engine_idle_rpm      = 1800
engine_clutch_rpm    = 4200
engine_rev_limit     = 10000
engine_torque_scale  = 0.85
engine_final_drive   = 7.5
engine_gear1         = 3.00
engine_gear2         = 2.20
engine_gear3         = 1.75
engine_gear4         = 1.45
engine_gear5         = 1.25
engine_shift_time    = 0.12
engine_inertia       = 0.005
engine_brake         = 8.0
engine_efficiency    = 0.9
engine_reverse_torque = 140     # Nm en la rueda en marcha atrás (caja auto: parado, mantener freno)
engine_reverse_speed  = 6.0     # rad/s de rueda como tope (~7 km/h)

# --- Surcos físicos (F8, apagado por defecto) -----------------------------------------
rut_dig_rate         = 0.00012  # m por paso de física y por m/s de patinaje trasero
rut_max_depth        = 0.10     # m
