# ------------------------------------------------------------------------------
# Dos tiempos 250 (example bike of the "sandbox" mod). Read AFTER tuning.ini: only the keys below
# change, everything else stays as in tuning.ini. Any key of tuning.ini can go here. F5 reloads.
# ------------------------------------------------------------------------------

# --- Lighter: 100 kg bike + 75 kg rider ------------------------------------------
mass           = 175
inertia_pitch  = 60
inertia_yaw    = 46
inertia_roll   = 24

# --- Engine: less torque down low, revs higher, shorter gearing ------------------
# La curva de la 450 estirada un 15% en vueltas (pico de torque a ~8000 rpm, de potencia a ~10300, como una 250 2T):
# con la misma curva y 0.8 de torque era una 450 más floja, no "se despertaba arriba". Ahora tiene un 17% menos a
# 4000 rpm y un 24% más a 11000, ~46 hp, y la caja automática cambia a ~10800 (1ª hasta ~54 km/h).
engine_rpm_scale    = 1.15
engine_torque_scale = 0.72
engine_rev_limit    = 11500
engine_clutch_rpm   = 5200
engine_final_drive  = 8.2
engine_brake        = 4.0       # two-strokes barely engine-brake
engine_two_stroke   = 1         # sound: fires every turn, "on the pipe" above ~60% of the rev limit, four-strokes off throttle

# --- Softer suspension for the park ----------------------------------------------
front_spring   = 6200
rear_spring    = 6800

# --- Frenada con la S (como la motocross, ver docs/FISICA.md) -----------------------------
# Frenando fuerte hacía un trompo (la cola se cruzaba 104-165° desde 90 km/h): con la trasera casi sin carga la moto es
# inestable de guiñada. Sólo actúa con el freno de adelante; el derrape con el trasero no cambia.
brake_align         = 4
brake_align_torque  = 2000

# --- Suspensión más viva al aterrizar (como la motocross) ---------------------------------
# Con la extensión amortiguada 3 veces más que la compresión volvía a su altura en ~0.7 s, sin rebote.
front_rebound_ratio = 1.7
rear_rebound_ratio  = 1.7

# Freno de mano (como la 450, ver docs/FISICA.md "Freno de mano"): doblando y clavando el trasero la cola sale ~20-30°.
handbrake_yaw = 5000
