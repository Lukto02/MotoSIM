# ------------------------------------------------------------------------------
# Trilheira 450 (mapa Morro do Grau; la usa mods/base/bikes/trilheira.json). Se lee DESPUÉS de
# tuning.ini y pisa sólo lo que está acá.
# También se recarga con F5. Una trail de calle preparada: más pesada y con más motor que la de
# motocross, cubiertas mixtas que agarran más en el pavimento y el limitador de wheelie más
# permisivo (el grau es la gracia).
# ------------------------------------------------------------------------------

# --- Masa (moto 120 kg + piloto 75 kg) --------------------------------------------
mass           = 195
inertia_pitch  = 74
inertia_yaw    = 58
inertia_roll   = 29

# --- Suspensión: un poco más firme por el peso -----------------------------------
front_spring   = 7400
rear_spring    = 8000

# --- Cubiertas mixtas ----------------------------------------------------------------
front_tire_long_grip = 1.05
front_tire_lat_grip  = 1.15
rear_tire_long_grip  = 1.08
rear_tire_lat_grip   = 1.12

# --- Motor: más torque, relación corta y largada arriba de vueltas ---------------------------------
# Para el grau se usa corona grande (relación corta): más fuerza en la rueda en 1ª y 2ª, que es donde
# se levanta la trompa andando despacio (y de sobra para las calles del morro: ~120 km/h en 5ª). Al
# largar el piloto patina el embrague con el motor lleno (5500 rpm en vez de 4200).
engine_torque_scale  = 1.15
engine_rev_limit     = 9500
engine_final_drive   = 7.8
engine_clutch_rpm    = 5500

# --- Dirección: giros cerrados de calle (zerinho, vueltas en U en el lugar) ----------------------
max_steer_deg        = 45
min_turn_radius      = 1.55
max_lateral_accel    = 10.0    # cubiertas mixtas en el asfalto: un poco más de agarre en las curvas
lean_steer_speed_low = 5       # con manubrio hasta más rápido (curvas cerradas a velocidad media)

# --- Limitador de wheelie de motocross: apagado (manda el grau, abajo) ------------------------------
wheelie_start_deg     = 0
wheelie_end_deg       = 0

# --- Freestyle de favela (grau y giros cerrados): sólo esta moto --------------------------------
# El limitador de wheelie de motocross (corta gas) se apaga: lo reemplaza el piloto del grau. Tirado
# atrás (flecha abajo) sostiene la moto en el punto de equilibrio con el gas y el pie en el freno
# trasero, y maneja la velocidad con la altura (más alto frena, más bajo acelera): W suelto es un grau
# a paso de hombre, W a fondo uno rápido. Soltando la flecha la rueda baja despacio.
grau_assist            = 1.0
grau_speed_min         = 2.2    # m/s (8 km/h): grau sin gas
grau_speed_max         = 6.0    # m/s (22 km/h): grau con el gas a fondo
grau_hold_hz           = 4.0    # qué tan firme corrige la altura
grau_pitch_neutral_deg = 8      # soltando la flecha la rueda baja despacio hasta acá
grau_brake             = 0.9
grau_clutch_pop        = 0.9    # embrague soltado de golpe: tirado atrás, gas de golpe yendo despacio
grau_pop_time          = 0.3
grau_turn              = 900    # en una rueda dobla acostando la moto: la moto gira a la par de su trayectoria
grau_align             = 4      # y vuelve a apuntar hacia donde va (la trasera no queda cruzada)
rider_shift            = 0.30   # tirado atrás corre bien el peso (como en los videos): el equilibrio baja y levantar cuesta menos
wheelie_lean_torque    = 100

# Derrapes de calle: el control de tracción deja patinar más (con gas en la curva la cola sale de
# lado) y con el trasero solo se puede tirar la cola hasta casi cruzarla (cavalo de pau).
tc_slip                = 0.6
slide_angle_max        = 85
slide_speed_max        = 16
