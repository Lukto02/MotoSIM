# ------------------------------------------------------------------------------
# Motocross 450 (la usa mods/base/bikes/motocross.json). Se lee DESPUÉS de tuning.ini y pisa sólo lo que
# está acá. tuning.ini sigue siendo la Motocross (y la base de las demás motos): esto es sólo de ella.
# ------------------------------------------------------------------------------

# --- Frenada con la S ---------------------------------------------------------
# Frenando fuerte desde ~100 km/h hacía un trompo (la cola se cruzaba 140-167°): con la trasera casi sin
# carga la moto es inestable de guiñada. Con esto la delantera sigue su camino y la moto apunta hacia donde
# va. Sólo actúa con el freno de adelante (S): el derrape con el trasero (Espacio) no cambia. Ver
# docs/FISICA.md ("La motocross: frenando fuerte hacía un trompo").
brake_align         = 4
brake_align_torque  = 2000

# --- Suspensión ------------------------------------------------------------------
# Más viva al aterrizar: con la extensión amortiguada 3 veces más que la compresión (tuning.ini) volvía a su
# altura en ~0.7 s arrastrándose, sin rebote ("muerta"). Con 1.7 vuelve en ~0.25 s, casi sin pasarse; desde
# 5 m se estira casi del todo (las ruedas no se despegan más de 0.02 s). Ver docs/FISICA.md.
front_rebound_ratio = 1.7
rear_rebound_ratio  = 1.7
