# ------------------------------------------------------------------------------
# Naked 950 (la usa mods/base/bikes/naked.json). Se lee DESPUÉS de tuning.ini y pisa sólo lo que está acá.
# También se recarga con F5.
# Una naked deportiva de calle, para ir rápido por la autopista pasando entre los autos: 3 cilindros en línea de
# ~950 cc con mucho empuje en medios (145 CV a ~10 800 rpm, 102 Nm a ~8400, corte a 11 500), 185 kg en orden de
# marcha, manubrio ancho y piloto más erguido que en la Carrera, cubiertas de calle (no lisas), frenos fuertes con ABS
# en curva y una dirección rápida para tirarla de un lado al otro. Contrapartes reales: Triumph Speed Triple 1200 RS
# (180 CV, 198 kg), Yamaha MT-09 (119 CV, 193 kg), Street Triple 765 RS (130 CV, 188 kg), KTM 990 Duke (123 CV,
# 190 kg). La base es la de la Carrera (el mismo "esqueleto" de moto de asfalto): lo que cambia, comentado.
# ------------------------------------------------------------------------------

# --- Masa (moto 185 kg + piloto 75 kg) -----------------------------------------------
mass           = 260
inertia_pitch  = 70      # más larga y más pesada que la Carrera, el piloto sentado más alto
inertia_yaw    = 64
inertia_roll   = 24      # el piloto erguido sube la inercia de rolido (la Carrera, agachada: 22)
rider_shift    = 0.11
# Centro de masa 3 cm más bajo que el de tuning.ini (0.59 m del piso; la Carrera, agachada, 0.56): el piloto sentado
# erguido lo sube. El límite de stoppie queda en ~1.1 g.
com_height     = -0.03

# --- Geometría (eje con la suspensión totalmente comprimida) ------------------------------
# La de la Carrera con 2 cm más entre ejes (1.44 m) y medio grado más de lanzamiento: más aplomo derecha a 200+
# (Speed Triple 1.41 m / 24.4°, MT-09 1.43 m / 25°, S1000R 1.45 m / 24.6°). Las piezas (BikeMeshes.cpp, sección
# NAKED) están armadas para estas medidas.
front_mount_y  = -0.250
front_mount_z  = 0.652
rake_deg       = 24.5
rear_mount_y   = -0.220
rear_mount_z   = -0.768
rear_axis_deg  = -4

# --- Suspensión: de calle, un poco más larga y blanda que la de pista -----------------------
front_travel               = 0.13
front_spring               = 30000   # ~2.1 Hz con 260 kg
front_damping              = 1400
front_rebound_ratio        = 2.2
front_bottoming_damping    = 3.0
front_progressivity        = 1.0
front_bump_stop            = 200000
front_bump_damping         = 8000
front_max_damper_velocity  = 6.0

rear_travel                = 0.14
rear_spring                = 29000
rear_damping               = 1350
rear_rebound_ratio         = 2.3
rear_bottoming_damping     = 3.0
rear_progressivity         = 1.2
rear_bump_stop             = 200000
rear_bump_damping          = 8000
rear_max_damper_velocity   = 6.0

# --- Cubiertas deportivas de calle 120/70-17 y 180/55-17 (con dibujo, no lisas) -----------------
# Agarran un poco menos que las lisas de la Carrera en el asfalto (~1.2 g en vez de 1.3) y algo más en la tierra y el pasto
# (0.42 contra 0.35: el dibujo muerde algo). Perfil redondo como la Carrera (el contacto se corre al inclinar). Con 0.5 y
# sin lean_surface_grip (abajo), el bot daba la vuelta a la pista de motocross más rápido que la 450 (1:03.4 contra 1:04.2)
# y en la tierra se acostaba 54° doblando a 0.71 g, cruzada: no era creíble.
front_tire_radius     = 0.30
front_tire_inertia    = 0.45
front_tire_long_grip  = 1.45
front_tire_lat_grip   = 1.50
front_tire_roundness  = 0.06
front_tire_stiffness  = 280000
front_tire_damping    = 3000
front_tire_rebound_damping = 15000
front_tire_unsprung_mass = 11
front_tire_loose_grip = 0.42

rear_tire_radius      = 0.315
rear_tire_inertia     = 0.75
rear_tire_long_grip   = 1.50
rear_tire_lat_grip    = 1.55
rear_tire_roundness   = 0.09
rear_tire_stiffness   = 280000
rear_tire_damping     = 3000
rear_tire_rebound_damping = 15000
rear_tire_unsprung_mass = 14
rear_tire_loose_grip  = 0.42

cornering_stiffness = 40     # carcasa de calle: un poco más de deriva que la de carrera (45)

# --- Frenos y resistencias -------------------------------------------------------------------
# Dos discos de 320 mm con pinzas radiales monobloque y ABS en curva: ~1.1 g en recta (el límite de stoppie con el
# piloto sentado alto). El trasero chico, como la Carrera (la S frena también atrás a la mitad).
front_brake_torque  = 860
rear_brake_torque   = 140
abs_slip            = 0.12
stoppie_yaw_damping = 4000
slide_pivot         = 0      # de calle: nada de derrapes con el trasero a paso de hombre
brake_align         = 8      # frenando fuerte (derecho o doblando) apunta hacia donde va: la cola no se cruza
brake_align_torque  = 2000
brake_yaw_comp      = 1      # frenando inclinada sigue la curva
rear_lift_load      = 300    # N: con menos carga atrás el ABS afloja la delantera (la cola no salta)
rear_lift_mitigation = 0.25
brake_stand_up      = 0.25   # frenando inclinada casi no se endereza (se puede frenar doblando entre los autos)
brake_transition_release = 0.3
flat_side_exact     = 1      # los ángulos en el plano contra el perpendicular al rumbo (ver carrera.ini y FISICA.md)
brake_align_rear    = 1      # brake_align también con el trasero solo (Espacio)
rolling_resistance  = 0.015
drag_area           = 0.50   # Cd * A sin carenado, el piloto erguido: ~245 km/h de final (una naked de 140-180 CV, 240-260)

# --- Dirección y balance ------------------------------------------------------------------------
lean_sweep_comp           = 1
max_steer_deg             = 31   # manubrio ancho de naked: más giro que los semimanillares de la Carrera (28)
max_steer_high_speed_deg  = 6
steer_rate                = 3.5
caster_align              = 2.5
caster_deadzone_deg       = 5.5
min_turn_radius           = 2.4  # 1.44 m entre ejes / tan 31°
max_lateral_accel         = 12   # cubiertas de calle en asfalto: ~1.2 g (la moto se acuesta ~51°)
max_lean_deg              = 58
# En la tierra y el pasto pide la curva que dan las cubiertas ahí y no la del asfalto: dobla a ~0.57 g acostada 32°, sin
# cruzarse (la 450 0.93 g; la Carrera, sin esto, 0.5 g acostada 58° y cruzada). El bot de la pista de motocross: 1:05.6-1:05.7
# sin caídas (la 450, 1:04.2); el de la favela 1:34.4 sin caídas. En el asfalto no cambia nada (agarra más que max_lateral_accel).
lean_surface_grip         = 1
leg_out_speed_min         = 200  # sin pata afuera de motocross
leg_out_speed_max         = 200
# El balance de la Carrera. Tuvo 12000 / 1800 / 10000 para tirarse más rápido de un lado al otro, pero con el stick eso la
# hacía saltar del piso; lo rápida que cambia de lado ahora lo dan lean_rate / lean_accel (abajo), y con 6000 / 1600 el
# slalom da lo mismo (ver docs/FISICA.md, "Cambiar de lado: la moto no tenía peso").
balance_k_high            = 6000
balance_d_high            = 1600
balance_max_torque        = 6000
slide_angle_max           = 35

# --- Aire: pesada, no se revolea ------------------------------------------------------------------
air_pitch_rate            = 1.2
air_pitch_torque          = 260
air_body_tilt_deg         = 15

# --- Electrónica (de calle: deja levantar un poco la rueda, el control de tracción deja patinar apenas) -------
wheelie_start_deg      = 3
wheelie_end_deg        = 8
wheelie_lean_back_deg  = 5
wheelie_gear_fade      = 0.7
wheelie_assist_torque  = 800
wheelie_lean_torque    = 300
wheelie_keep_throttle  = 0
tc_slip                = 0.07

# --- Motor: 3 en línea de ~950 cc, 145 CV a ~10 800 rpm, 102 Nm a ~8400, corte a 11 500 ------------------
# La curva de la 450 estirada en vueltas x1.2 (el torque máximo a ~8400, lleno desde ~6000: el empuje en medios del
# tricilíndrico) y escalada. La caja automática cambia a 9400 x 1.2 = 11 280 rpm.
engine_rpm_scale     = 1.2
engine_torque_scale  = 2.17
engine_cylinders     = 3        # el sonido: tres explosiones cada dos vueltas (ni el golpe del mono ni el grito del 4)
engine_idle_rpm      = 1400
engine_clutch_rpm    = 6000
engine_rev_limit     = 11500
engine_efficiency    = 0.92
engine_inertia       = 0.007
# Freno motor como la Carrera (embrague antirrebote): con 24, soltando una curva con el trasero clavado (Espacio) la
# trasera, frenada por los dos, no agarraba de costado y la moto quedaba inclinada para un lado y doblando para el otro
# (tools/alreves.py: 10 de 172 casos; con 14, 3 de 16 casos del trasero; con 10, 1 de 172, como la Carrera). Con 10 en
# 3ª a 100 km/h frena ~0.05 g (con el aire, ~0.15 g).
engine_brake         = 10
engine_shift_time    = 0.06     # quickshifter
# Caja de 5: ~115 km/h en 1ª, ~250 km/h en 5ª al corte (el aire la deja en ~245).
engine_final_drive   = 4.5
engine_gear1         = 2.600
engine_gear2         = 2.141
engine_gear3         = 1.763
engine_gear4         = 1.452
engine_gear5         = 1.196

# --- Equilibrio por la carga, como la Carrera (ver docs/FISICA.md, "El equilibrio era un giroscopio") -------------
lean_load = 1
lean_load_world_deg = 58
balance_fast_k = 0.6
balance_fast_d = 0.8
balance_fast_lead = 0.5
# Cambiar de lado con peso (ver docs/FISICA.md, "Cambiar de lado: la moto no tenía peso"): con el stick de lado a lado
# rolaba 450-700°/s, el balance (12000 / 1800, tope 10000) la levantaba del piso y se caía en casi cada cambio. Ahora un
# poco más viva que la Carrera (manubrio ancho): ±50° en ~0.95 s a 30-60 km/h, 1.2 s a 150, 128°/s de pico.
lean_rate = 2.3
lean_accel = 18
lean_rate_speed = 30
