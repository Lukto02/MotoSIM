# ------------------------------------------------------------------------------
# Carrera 1000 (la usa mods/base/bikes/carrera.json). Se lee DESPUÉS de tuning.ini y pisa sólo lo
# que está acá. También se recarga con F5.
# Una moto de carreras de asfalto: 160 kg, 4 cilindros en línea de ~245 CV que gira a 16500, slicks,
# suspensión corta y dura, geometría de pista (lanzamiento 24°, 1.42 m entre ejes) y electrónica de
# carrera (anti-wheelie, control de tracción, ABS y anti-endo).
# ------------------------------------------------------------------------------

# --- Masa (moto 160 kg + piloto 75 kg) ---------------------------------------------
mass           = 235
inertia_pitch  = 62      # piloto agachado sobre el tanque: todo más compacto que en la de motocross
inertia_yaw    = 52
inertia_roll   = 22
rider_shift    = 0.10    # el piloto (75 de los 235 kg) se corre ~30 cm: el conjunto, 10
rider_side_shift = 0.08  # colgarse de costado (flechas): la cadera sale del asiento

# --- Geometría (eje con la suspensión totalmente comprimida) --------------------------
# Con el piloto arriba (sag ~36 mm adelante, ~37 atrás) los ejes quedan a 0.32 / 0.31 m bajo el centro
# de masa, que va a 0.62 m del piso: 1.42 m entre ejes, 52% del peso adelante. Las piezas de la moto
# (BikeMeshes.cpp, sección RACE) están armadas para estas medidas.
front_mount_y  = -0.243
front_mount_z  = 0.646
rake_deg       = 24
rear_mount_y   = -0.217
rear_mount_z   = -0.7465
rear_axis_deg  = -4      # basculante casi horizontal: el eje sube derecho (apenas hacia adelante)

# --- Suspensión: corta y dura, bien amortiguada ------------------------------------------
front_travel               = 0.12
front_spring               = 28000   # N/m (sin precarga en el modelo: el sag sale sólo del resorte), ~2.2 Hz
front_damping              = 1400
front_rebound_ratio        = 2.2
front_bottoming_damping    = 3.0
front_progressivity        = 1.0
front_bump_stop            = 200000
front_bump_damping         = 8000
front_max_damper_velocity  = 6.0

rear_travel                = 0.13
rear_spring                = 27000   # ~2.4 Hz
rear_damping               = 1300
rear_rebound_ratio         = 2.3
rear_bottoming_damping     = 3.0
rear_progressivity         = 1.2
rear_bump_stop             = 200000
rear_bump_damping          = 8000
rear_max_damper_velocity   = 6.0

# --- Slicks 120/70-17 y 190/50-17 ------------------------------------------------------------
# Perfil redondo (roundness = radio de la sección: el contacto se corre al costado al inclinar; es
# el mismo radio de la banda de rodamiento de las mallas). Asfalto de pista (x1.08): μ ~1.7 de costado.
front_tire_radius     = 0.30
front_tire_inertia    = 0.45
front_tire_long_grip  = 1.50
front_tire_lat_grip   = 1.60
front_tire_roundness  = 0.06
front_tire_stiffness  = 300000
front_tire_damping    = 3000
front_tire_rebound_damping = 15000
front_tire_unsprung_mass = 10
front_tire_loose_grip = 0.35   # lisa: en la tierra y el pasto no muerde (patina); en el asfalto, 1

rear_tire_radius      = 0.31
rear_tire_inertia     = 0.75
rear_tire_long_grip   = 1.60
rear_tire_lat_grip    = 1.55
rear_tire_roundness   = 0.095
rear_tire_stiffness   = 300000
rear_tire_damping     = 3000
rear_tire_rebound_damping = 15000
rear_tire_unsprung_mass = 13
rear_tire_loose_grip  = 0.35

# Carcasa de carrera muy rígida: deriva chica (~2° a 1.3 g). Con 14 (la de motocross) a 150 km/h la
# moto inclinada casi no dobla: la curva sale de la deriva, y frenar o acelerar inclinada (la fuerza en
# el contacto, 0.4 m al costado del centro de masa) la tuerce más que la dirección.
cornering_stiffness = 45

# --- Frenos y resistencias ----------------------------------------------------------------
# Nota de frenos: a fondo la moto frena ~1 g con los frenos (más el aire arriba de 200 km/h: ~1.2 g
# desde 330). Más fuerte, la trasera queda en el aire y, apoyada sólo adelante, la moto se cruza (en
# el modelo la delantera no se alinea sola como con la dirección libre de una de verdad). El trasero es
# chico para que no se trabe con la trasera liviana (la S del teclado frena también atrás a la mitad).
front_brake_torque  = 620    # dos discos de 330 mm con pinzas radiales
rear_brake_torque   = 120
abs_slip            = 0.12   # ABS de carrera (y anti-endo)
stoppie_yaw_damping = 4000   # con la trasera en el aire el piloto la mantiene derecha
slide_pivot         = 0      # de pista: nada de derrapes con el trasero
brake_align         = 4      # frenando fuerte y derecho: la delantera sigue su camino y la moto vuelve a apuntar hacia donde va
rear_lift_load      = 450    # N: con menos carga atrás el ABS afloja la delantera (la cola no salta)
rear_lift_mitigation = 0.35
rolling_resistance  = 0.015
drag_area           = 0.36   # Cd * A con el piloto agachado atrás del parabrisas: ~330 km/h de final

# --- Dirección y balance ------------------------------------------------------------------------
max_steer_deg             = 28   # tope de dirección de una moto de pista (poco giro, clip-ons)
max_steer_high_speed_deg  = 6
steer_rate                = 3.0
# Contravolante automático fuerte pero sólo cuando la cola se cruza de verdad (en una curva a fondo
# la trasera ya deriva ~2-3°): frenando fuerte endereza la moto en vez de dejarla cruzarse.
caster_align              = 2.5
caster_deadzone_deg       = 5.5
min_turn_radius           = 2.8  # 1.42 m entre ejes / tan 28°
max_lateral_accel         = 13   # slicks calientes en asfalto: ~1.3 g (la moto se acuesta ~55°)
max_lean_deg              = 62
leg_out_speed_min         = 200  # sin pata afuera de motocross: los pies siempre en las estriberas
leg_out_speed_max         = 200
# Balance firme: a 250 km/h la moto sigue la inclinación pedida sin pasarse (con el de motocross se
# pasaba 15° y la curva no alcanzaba).
balance_k_high            = 6000
balance_d_high            = 1600
balance_max_torque        = 6000
slide_angle_max           = 35   # derrapes cortos con el trasero (no se cuadra como en tierra)

# --- Electrónica ---------------------------------------------------------------------------------
# Anti-wheelie: deja despegar apenas la rueda al salir de las curvas y corta el gas antes de que suba.
wheelie_start_deg      = 2.5
wheelie_end_deg        = 7
wheelie_lean_back_deg  = 5
wheelie_gear_fade      = 0.75
wheelie_assist_torque  = 800
wheelie_lean_torque    = 300
tc_slip                = 0.06   # control de tracción: la trasera patina apenas

# --- Motor: 4 en línea de 1000 cc, 245 CV a 15300 rpm, corte a 16500 ------------------------------
# La curva de la 450 estirada en vueltas (x1.7: el torque máximo, 122 Nm, a ~11900 rpm) y escalada.
engine_rpm_scale     = 1.7
engine_torque_scale  = 2.59
engine_cylinders     = 4
engine_idle_rpm      = 3000
engine_clutch_rpm    = 9000     # largada: el embrague patina con el motor lleno
engine_rev_limit     = 16500
engine_efficiency    = 0.92
engine_inertia       = 0.006
engine_brake         = 10       # freno motor controlado (embrague antirrebote)
engine_shift_time    = 0.05     # quickshifter
# Caja de 5 larga: ~155 km/h en 1ª, ~330 km/h (lo que deja el aire) en 5ª.
engine_final_drive   = 4.5
engine_gear1         = 2.711
engine_gear2         = 2.213
engine_gear3         = 1.805
engine_gear4         = 1.473
engine_gear5         = 1.202
