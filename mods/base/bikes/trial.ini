# ------------------------------------------------------------------------------
# Trial 300 (la usa mods/base/bikes/trial.json). Se lee DESPUÉS de tuning.ini y pisa sólo lo que
# está acá. También se recarga con F5. Una de trial de competición: liviana, corta entre ejes, con
# muchísimo giro de manubrio, motor dos tiempos lleno abajo y relación cortísima, suspensión blanda y
# cubiertas de trial a muy baja presión que se pegan a todo. El piloto va siempre de pie.
# ------------------------------------------------------------------------------

# --- Masa (moto 70 kg + piloto 75 kg) y poca inercia: se tira de un lado al otro con el cuerpo -----
mass           = 145
inertia_pitch  = 44
inertia_yaw    = 32
inertia_roll   = 19

# --- Piloto de pie: absorbe con brazos y piernas y corre el cuerpo rápido -----------------------
rider_speed         = 7.0
rider_pitch_damping = 170
rider_side_shift    = 0.12
leg_out_speed_max   = 0      # no saca la pata en las curvas: dobla parado, con el cuerpo

# --- Geometría: 1.32 m entre ejes, horquilla parada (23°), basculante largo ----------------
front_mount_y  = -0.30
front_mount_z  = 0.66
rake_deg       = 23
rear_mount_y   = -0.33
rear_mount_z   = -0.58

# --- Suspensión: blanda y con bastante recorrido para lo que pesa (sag ~29% adelante y ~38% atrás),
# progresiva y con el cono de fin de recorrido para que una bajada de un metro no haga tope. El
# hidráulico se abre en los golpes secos (tope de velocidad bajo): un canto o un tronco no patean.
front_travel               = 0.23
front_spring               = 7000
front_damping              = 650
front_rebound_ratio        = 3.2
front_bottoming_damping    = 6.0
front_progressivity        = 3.0
front_max_damper_velocity  = 4.5
rear_travel                = 0.21
rear_spring                = 7000
rear_damping               = 700
rear_rebound_ratio         = 3.2
rear_bottoming_damping     = 6.0
rear_progressivity         = 2.6
rear_max_damper_velocity   = 4.5

# --- Cubiertas de trial: goma blanda a ~0.4 bar. Muy blandas de carcasa (el canto de un escalón se
# hunde en la cubierta en vez de patear la moto) y con muchísimo agarre, sobre todo la de atrás.
front_tire_inertia        = 0.45
front_tire_long_grip      = 1.15
front_tire_lat_grip       = 1.25
front_tire_stiffness      = 70000
front_tire_damping        = 500
front_tire_unsprung_mass  = 8
rear_tire_inertia         = 0.65
rear_tire_long_grip       = 1.40
rear_tire_lat_grip        = 1.30
rear_tire_roundness       = 0.05
rear_tire_stiffness       = 60000
rear_tire_damping         = 450
rear_tire_unsprung_mass   = 10
max_lateral_accel         = 10.0

# --- Frenos (moto liviana: menos torque hace lo mismo) y un piloto parado que frena el aire --------
front_brake_torque  = 700
rear_brake_torque   = 380
drag_area           = 0.60

# --- Dirección: tope de 48° y giro en ~1.3 m a paso de hombre; muy estable despacio -------------
max_steer_deg             = 48
max_steer_high_speed_deg  = 12
steer_rate                = 5.0
min_turn_radius           = 1.2
lean_steer_speed_low      = 5
balance_k_low             = 4200
balance_d_low             = 850

# --- Motor dos tiempos de 300: ~28 HP, lleno desde abajo (la curva base estirada: pico de ~32 Nm a
# 5250 rpm), embrague suave que muerde a 3000 y relación cortísima (1ª hasta ~33 km/h, 5ª ~90). El
# corte a 9500 deja que la caja automática (cambia a 9400) pase de marcha.
engine_rpm_scale    = 0.75
engine_torque_scale = 0.675
engine_rev_limit    = 9500
engine_idle_rpm     = 1500
engine_clutch_rpm   = 3000
engine_final_drive  = 10.0
engine_gear1        = 3.6
engine_gear2        = 2.7
engine_gear3        = 2.05
engine_gear4        = 1.6
engine_gear5        = 1.3
engine_inertia      = 0.006   # volante pesado: tracción en lo resbaloso
engine_brake        = 5.0
